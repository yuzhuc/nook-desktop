name: Build and Upload to Releases

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-latest
            runtime: osx-x64
            package_prefix: nook-desktop-osx-x64
          - name: macOS arm64
            os: macos-latest
            runtime: osx-arm64
            package_prefix: nook-desktop-osx-arm64
          - name: Linux x64
            os: ubuntu-latest
            runtime: linux-x64
            package_prefix: nook-desktop-linux-x64
          - name: Linux arm64
            os: ubuntu-latest
            runtime: linux-arm64
            package_prefix: nook-desktop-linux-arm64
          - name: Windows x64
            os: windows-latest
            runtime: win-x64
            package_prefix: nook-desktop-win-x64
          - name: Windows arm64
            os: windows-latest
            runtime: win-arm64
            package_prefix: nook-desktop-win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore nook-desktop.slnx

      - name: Publish application
        run: >
          dotnet publish nook-desktop/nook-desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./publish

      - name: Package application
        shell: pwsh
        run: |
          $prefix = "${{ matrix.package_prefix }}"
          Compress-Archive -Path "./publish/*" -DestinationPath "$prefix.zip" -Force
          tar -czf "$prefix.tar.gz" -C ./publish .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_prefix }}
          path: |
            ${{ matrix.package_prefix }}.zip
            ${{ matrix.package_prefix }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nook-desktop-*
          path: packages
          merge-multiple: true

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.sha }}
          name: Build ${{ github.sha }}
          files: packages/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
