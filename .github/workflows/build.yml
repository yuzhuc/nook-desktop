name: Build and Upload to Releases

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_PREFIX: nook-desktop-win-x64

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore nook-desktop.slnx

      - name: Publish application
        run: >
          dotnet publish nook-desktop/nook-desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish

      - name: Package into multiple formats
        shell: pwsh
        run: |
          $prefix = "${{ env.PACKAGE_PREFIX }}"
          $source = "./publish"

          Compress-Archive -Path "$source/*" -DestinationPath "$prefix.zip" -Force
          7z a -bd "$prefix.7z" "$source/*" | Out-Null
          tar -czf "$prefix.tar.gz" -C "$source" .

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.sha }}
          name: Build ${{ github.sha }}
          files: |
            ${{ env.PACKAGE_PREFIX }}.tar.gz
            ${{ env.PACKAGE_PREFIX }}.zip
            ${{ env.PACKAGE_PREFIX }}.7z
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
