name: Deploy standalone to build branch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runtime: osx-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore nook-desktop.slnx

      - name: Publish application
        run: >
          dotnet publish nook-desktop/nook-desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./publish

      - name: Package build
        shell: bash
        run: tar -czf "${{ matrix.runtime }}.tar.gz" -C publish .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: ${{ matrix.runtime }}.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to build branch
    needs: build
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: "*-x64"
          path: artifacts

      - name: Extract builds
        run: |
          mkdir -p publish
          for archive in artifacts/*/*.tar.gz; do
            runtime="$(basename "$archive" .tar.gz)"
            mkdir -p "publish/$runtime"
            tar -xzf "$archive" -C "publish/$runtime"
          done

      - name: Copy repository files
        run: |
          cp README.md README_zh.md LICENSE.txt publish/

      - name: Deploy to build branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: publish
          branch: build
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
