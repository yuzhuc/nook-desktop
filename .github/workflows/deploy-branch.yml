name: Deploy standalone to build branch

on:
  workflow_dispatch:
    inputs:
      osx_x64:
        description: macOS x64
        type: boolean
        default: false
      osx_arm64:
        description: macOS arm64
        type: boolean
        default: false
      linux_x64:
        description: Linux x64
        type: boolean
        default: false
      linux_arm64:
        description: Linux arm64
        type: boolean
        default: false
      win_x64:
        description: Windows x64
        type: boolean
        default: true
      win_arm64:
        description: Windows arm64
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select targets
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OSX_X64: ${{ inputs.osx_x64 }}
          OSX_ARM64: ${{ inputs.osx_arm64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
          WIN_X64: ${{ inputs.win_x64 }}
          WIN_ARM64: ${{ inputs.win_arm64 }}
        run: |
          entries=()
          add() {
            entries+=("{\"os\":\"$1\",\"runtime\":\"$2\"}")
          }
          if [[ "$EVENT_NAME" == "push" || "$OSX_X64" == "true" ]]; then add macos-latest osx-x64; fi
          if [[ "$EVENT_NAME" == "push" || "$OSX_ARM64" == "true" ]]; then add macos-latest osx-arm64; fi
          if [[ "$EVENT_NAME" == "push" || "$LINUX_X64" == "true" ]]; then add ubuntu-latest linux-x64; fi
          if [[ "$EVENT_NAME" == "push" || "$LINUX_ARM64" == "true" ]]; then add ubuntu-latest linux-arm64; fi
          if [[ "$EVENT_NAME" == "push" || "$WIN_X64" == "true" ]]; then add windows-latest win-x64; fi
          if [[ "$EVENT_NAME" == "push" || "$WIN_ARM64" == "true" ]]; then add windows-latest win-arm64; fi
          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "::error::At least one target must be selected."
            exit 1
          fi
          joined=$(IFS=,; echo "${entries[*]}")
          echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.runtime }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore nook-desktop.slnx

      - name: Publish application
        run: >
          dotnet publish nook-desktop/nook-desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./publish

      - name: Package build
        shell: bash
        run: tar -czf "${{ matrix.runtime }}.tar.gz" -C publish .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: ${{ matrix.runtime }}.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to build branch
    needs: build
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: artifacts

      - name: Extract builds
        run: |
          mkdir -p publish
          for archive in artifacts/*/*.tar.gz; do
            runtime="$(basename "$archive" .tar.gz)"
            mkdir -p "publish/$runtime"
            tar -xzf "$archive" -C "publish/$runtime"
          done

      - name: Copy repository files
        run: |
          cp README.md README_zh.md LICENSE.txt publish/

      - name: Deploy to build branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: publish
          branch: build
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
